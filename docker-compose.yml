services:
  web:
    build: .
    container_name: course_web
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --log-level info
    volumes:
      - .:/app  # можно убрать в проде
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - course_net

  db:
    image: postgres:15
    container_name: course_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - course_net

  redis:
    image: redis:7
    container_name: course_redis
    ports:
      - "6379:6379"
    networks:
      - course_net

  celery:
    build: .
    container_name: course_celery
    command: celery -A config worker -l info
    env_file:
      - .env
    depends_on:
      - web
      - redis
    networks:
      - course_net

  celery-beat:
    build: .
    container_name: course_celery_beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    depends_on:
      - web
      - redis
    networks:
      - course_net

networks:
  course_net:

volumes:
  postgres_data:
