[tool.poetry]
name = "course-work-sv-5"
version = "0.1.0"
description = ""
authors = ["svetlana-kolesnikova <sv.ps1286@gmail.com>"]

package-mode = false

readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
django = ">=5.0,<6.0"
django-celery-beat = "^2.8.1"
djangorestframework = ">=3.16.1,<4.0.0"
