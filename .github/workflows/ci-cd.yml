name: CI/CD Pipeline

# Запуск pipeline при пуше в develop или pull request
on:
  push:
    branches:
      - develop
  pull_request:

jobs:
  test-and-lint:
    name: Тесты и линтинг
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: course_work_5
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 400795Sv
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DJANGO_SECRET_KEY: testsecret
      DEBUG: "True"
      POSTGRES_DB: course_work_5
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 400795Sv
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Run linters
        run: |
          poetry run mypy .
          poetry run black --check .
          poetry run isort --check-only .
          poetry run flake8 .

      - name: Run tests with coverage
        run: |
          poetry run pytest --cov=.

      - name: Build Docker image
        run: docker build . -t course_web:ci

  deploy:
    name: Деплой на сервер
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/course-work-sv-5
            git pull origin develop
            docker-compose pull
            docker-compose up -d --build
